include:
  - project: 'qqvp/cmake-boilerplate'
    file: 'base.yml'

image: $CI_REGISTRY/qqvp/containers/qqvp-dev-u22:latest

# TODO
# - Cache builds to avoid re-building same commit

workflow:
  auto_cancel:
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG

variables:
  FF_SCRIPT_SECTIONS: True
  GIT_DEPTH: 1

  HEX_COPROC_REF: v10.2.3

###################################################################
#    Base templates
###################################################################

# This is for jobs that execute after (and, in fact, depend upon) a build
# job. Gitlab might update the files tracked by git in between dependent jobs,
# and that would cause the source timestamp to be newer than the artifacts',
# causing an unnecessary and time-consuming rebuild. To avoid that, we touch all
# build files (which should be quite fast; <1s in my machine).
.after-build:
  before_script:
    - builddir="$(echo $CI_JOB_NAME | cut -d_ -f1)_build"
    - sleep 1 # Give a small time difference for touch below
    - find $builddir -type f,d -exec touch {} +

.base-check-tcg:
  extends: .after-build
  script:
    - make -C $builddir -j -O --no-print-directory check-tcg V=1
      OVERRIDE_OPTS="$OVERRIDE_OPTS"
  artifacts:
    when: on_failure
    paths: [ "*_build" ]
    expire_in: 4 days

.base-check:
  extends: .after-build
  script:
    - $builddir/pyvenv/bin/meson test -C $builddir --no-rebuild --verbose
  artifacts:
    when: on_failure
    paths: [ "*_build" ]
    expire_in: 4 days
  # FIXME: For now, only hosts with a new enough libseccomp2 (2.5.x+) so that it
  # supports `close_range` system call is able to run qemu's `make check` in the
  # Ubuntu 22 container due to a bizarre issue with glib and docker:
  #
  # check-qjson: GLib-ERROR **: g_test_trap_subprocess() failed:
  # Failed to close file descriptor for child process (Operation not permitted)
  #
  # More info: https://gist.github.com/nathabonfim59/b088db8752673e1e7acace8806390242
  # Yet more info:
  # * https://github.com/moby/moby/issues/43595#issuecomment-1346939700
  # * https://github.com/seccomp/libseccomp/pull/322
  tags: [ new-libseccomp ]

##################################################################
#    Jobs
###################################################################

download_coproc_linux_x86:
  script:
    - quic/scripts/download-coproc.sh linux-x86-tag . $CI_SERVER_URL
      $CI_JOB_TOKEN $HEX_COPROC_REF
  artifacts:
    when: on_success
    paths: [ $HEX_COPROC_BIN ]

download_coproc_mac:
  script:
    - quic/scripts/download-coproc.sh mac-tag . $CI_SERVER_URL $CI_JOB_TOKEN
      $HEX_COPROC_REF
  artifacts:
    when: on_success
    paths: [ $HEX_COPROC_BIN ]
  tags:
    - mac

checkpatch:
  stage: .pre
  variables:
    GIT_DEPTH: 50
    GIT_FETCH_EXTRA_FLAGS: --filter=blob:none --filter=tree:0 --prune --quiet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script: quic-gitlab-ci.d/checkpatch.sh

user_guide:
  stage: build
  script:
    - make -C quic/user_guide/ html latexpdf
  artifacts:
    paths: [ quic/user_guide/_build/html, quic/user_guide/_build/latex ]
    expire_in: 1 days


publish-internal:
  stage: deploy
  tags: [publish_runner]
  dependencies:
    - hexagon-linux-x86_64
    - user_guide
  script: quic/scripts/publish-internal.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# QEMU Hexagon for Linux on x86_64
hexagon-linux-x86_64:
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh -j linux-x86-tag -r $HEX_COPROC_REF hexagon,linux-x86_64
  artifacts:
    paths: [ build ]
    expire_in: 1 day

hexagon-linux-x86_64-tag:
  extends: hexagon-linux-x86_64
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    expire_in: never

hexagon-linux-x86_64-check-tcg:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-check-tcg.sh

hexagon-linux-x86_64-check-tcg-mttcg:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-check-tcg.sh -m

hexagon-linux-x86_64-check:
  stage: test
  tags: [ new-libseccomp ]
  dependencies:
    - hexagon-linux-x86_64
  script: ./build/pyvenv/bin/meson test -C build --no-rebuild --verbose

hexagon-linux-x86_64-qurt:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_qurt

hexagon-linux-x86_64-sival:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_sival

hexagon-linux-x86_64-boot:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_linux

hexagon-linux-x86_64-virtio:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_virtio

hexagon-linux-x86_64-perf:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-u24:latest
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  tags:
    - performance-hardware
  script: quic-gitlab-ci.d/scripts/hexagon-linux-x86_64-perf.sh
  artifacts:
    paths: [ "perf-results.json" ]
    expire_in: 4 days

hexagon-linux-x86_64-perf-mttcg:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-u24:latest
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  tags:
    - performance-hardware
  script: quic-gitlab-ci.d/scripts/hexagon-linux-x86_64-perf-mttcg.sh
  artifacts:
    paths: [ "perf-results.json" ]
    expire_in: 4 days

hexagon-linux-x86_64-perf-ml:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-u24:latest
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  tags:
    - performance-hardware
  script: quic-gitlab-ci.d/scripts/hexagon-linux-x86_64-perf-ml.sh
  artifacts:
    when: always
    paths: [ "perf-results.json",  ]
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
      allow_failure: true

# QEMU Hexagon for Linux on x86_64 with sanatizers enabled
hexagon-linux-x86_64-san:
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh -j linux-x86-tag -r $HEX_COPROC_REF hexagon,linux-x86_64,san
  artifacts:
    paths: [ build ]
    expire_in: 1 day

hexagon-linux-x86_64-san-check-tcg:
  stage: test
  dependencies:
    - hexagon-linux-x86_64
  script: quic/scripts/run-check-tcg.sh

hexagon-linux-x86_64-san-check:
  stage: test
  tags: [ new-libseccomp ]
  dependencies:
    - hexagon-linux-x86_64-san
  script: ./build/pyvenv/bin/meson test -C build --no-rebuild --verbose

hexagon-linux-x86_64-san-qurt:
  stage: test
  dependencies:
    - hexagon-linux-x86_64-san
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_qurt

hexagon-linux-x86_64-san-sival:
  stage: test
  dependencies:
    - hexagon-linux-x86_64-san
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_sival

hexagon-linux-x86_64-san-boot:
  stage: test
  dependencies:
    - hexagon-linux-x86_64-san
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_linux

hexagon-linux-x86_64-san-virtio:
  stage: test
  dependencies:
    - hexagon-linux-x86_64-san
  script: quic/scripts/run-functional-test.sh func-hexagon-hexagon_virtio

# QEMU Hexagon for macOS
hexagon-mac:
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh -j mac-tag -r $HEX_COPROC_REF hexagon,mac
  artifacts:
    paths: [ build ]
    expire_in: 1 day
  tags:
    - mac

hexagon-mac-tag:
  extends: hexagon-mac
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    expire_in: never

# QEMU Hexagon for Windows on x86_64
hexagon-windows-x86_64:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-win:latest
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh -p windows-x86_64 -s quic/install_win_deps.bat hexagon,windows-x86_64
  artifacts:
    paths: [ build ]
    expire_in: 1 day

hexagon-windows-x86_64-tag:
  extends: hexagon-windows-x86_64
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    expire_in: never

hexagon-windows-x86_64-check-tcg:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-win:latest
  stage: test
  dependencies:
    - hexagon-windows-x86_64
  script: quic/scripts/run-check-tcg.sh

# QEMU Hexagon for Windows on aarch64
hexagon-windows-aarch64:
  image: $CI_REGISTRY/qqvp/containers/qqvp-dev-win-aarch64:latest
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh -p windows-aarch64 -s quic/install_win_aarch64_deps.bat hexagon,windows-aarch64
  artifacts:
    paths: [ build ]
    expire_in: 1 day

hexagon-windows-aarch64-tag:
  extends: hexagon-windows-aarch64
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    expire_in: never

# QEMU Hexagon for Linux on x86_64 without idef parser
no-idef-parser-hexagon_build:
  extends: .base-build
  variables: { CONFIG_CMD: "$HEX_CONFIG_CMD --disable-hexagon-idef-parser" }
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
no-idef-parser-hexagon_and_coproc_build:
  needs: [no-idef-parser-hexagon_build, download_coproc_linux_x86]
  variables: { BUILDDIR: no-idef-parser-hexagon_build }
  script:
    - mv ${HEX_COPROC_BIN} ${BUILDDIR}
    - quic/scripts/create-qpm-layout.sh ${BUILDDIR}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  artifacts:
    paths: [ $BUILDDIR ]
    expire_in: 1 day
no-idef-parser-hexagon_install:
  needs: [no-idef-parser-hexagon_build]
  extends: .base-install
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
no-idef-parser-hexagon_check-tcg:
  needs: [no-idef-parser-hexagon_and_coproc_build]
  extends: .base-check-tcg
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
no-idef-parser-hexagon_check:
  needs: [no-idef-parser-hexagon_and_coproc_build]
  extends: .base-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# QEMU Hexagon for Linux on aarch64
aarch64-linux:
  stage: build
  script: quic-gitlab-ci.d/scripts/build.sh aarch64,linux-x86_64
  artifacts:
    paths: [ build ]
    expire_in: 1 day

aarch64-linux-tag:
  extends: aarch64-linux
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    expire_in: never
