    expire_in: never

hexagon-windows-x86_64-perf-ml:
  image: docker-registry.qualcomm.com/qqvp/qemu:windows-x86_64-test
  stage: test
  needs: [ "hexagon-windows-x86_64-cross" ]
  tags:
    - windows
    - x86_64
  timeout: 3h
  script: ./quic/msys2-ucrt64.ps1 ./quic-gitlab-ci.d/hexagon-windows-x86_64-perf-ml.sh
