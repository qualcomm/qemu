    when: always
    paths: [ "perf-results.json" ]
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
      allow_failure: true

