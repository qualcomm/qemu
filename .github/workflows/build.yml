name: Upstream QEMU CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkapply:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      # to debug container live from GitHub
      # - uses: mxschmitt/action-tmate@v3
      - run: bash -c '[ ! -f shazam.log ] || { cat shazam.log; exit 1; }'

  checkpatch:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: git fetch -a origin --unshallow || true
      - run: git remote add upstream -f https://gitlab.com/qemu-project/qemu
      - run: ./scripts/checkpatch.pl $(git merge-base upstream/master HEAD)..HEAD

  build-cross:
    needs: checkapply
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # all our host architectures (find tcg -type d) +
        # other distros +
        # windows cross
        container: [alpine,debian-amd64-cross,debian-arm64-cross,debian-loongarch-cross,debian-ppc64el-cross,debian-riscv64-cross,debian-s390x-cross,debian-sparc64-cross,fedora-win64-cross,fedora,ubuntu2404]
    steps:
      - uses: actions/checkout@v6
      - run: pip install meson
      - run: sudo apt update && sudo apt install -y qemu-user-binfmt
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:${{matrix.container}}
          bash -cx './configure --enable-werror $QEMU_CONFIGURE_OPTS && ninja -C build install'
      - if: matrix.container != 'fedora-win64-cross'
        run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:${{matrix.container}}
          ./build/tests/unit/test-multi-target

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-26.04
          - arch: aarch64
            image: ubuntu-26.04-arm
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - &free-disk
        run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure --enable-werror && ninja -C build install'
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          ./build/qemu-${{matrix.arch}} -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000  -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin ./build/qemu-system-x86_64 --version

  build-windows:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - sys: UCRT64
            image: windows-2025
            arch: x64
          - sys: CLANG64
            image: windows-2025
            arch: x64
          - sys: MINGW64
            image: windows-2025
            arch: x64
          - sys: CLANGARM64
            image: windows-11-arm
            arch: arm64
    runs-on: ${{matrix.image}}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{matrix.sys}}
      - uses: actions/checkout@v6
      - run: >
          pacman -S --noconfirm base-devel binutils bison curl diffutils flex git grep make sed
          ${MINGW_PACKAGE_PREFIX}-toolchain
          ${MINGW_PACKAGE_PREFIX}-glib2
          ${MINGW_PACKAGE_PREFIX}-gtk3
          ${MINGW_PACKAGE_PREFIX}-libnfs
          ${MINGW_PACKAGE_PREFIX}-libssh
          ${MINGW_PACKAGE_PREFIX}-ninja
          ${MINGW_PACKAGE_PREFIX}-pixman
          ${MINGW_PACKAGE_PREFIX}-pkgconf
          ${MINGW_PACKAGE_PREFIX}-python
          ${MINGW_PACKAGE_PREFIX}-SDL2
          ${MINGW_PACKAGE_PREFIX}-zstd
      # Install all dependencies for windows build
      - run: git clone https://github.com/msys2/MINGW-packages --depth=1
      - run: pushd ./MINGW-packages/mingw-w64-qemu && (makepkg --syncdeps --nobuild --noprepare --noconfirm --skippgpcheck PKGBUILD || true) && popd
      # Install debug tools (gflags, cdb), included in wdk:
      - run: /c/ProgramData/Chocolatey/bin/choco install -y windowsdriverkit11
      - run: ./configure --enable-werror --disable-docs && ninja -C build
      # detect dll issue by loading qemu binary with cdb (run + quit)
      # enable verbose load debug with gflags
      # https://ten0s.github.io/blog/2022/07/01/debugging-dll-loading-errors
      - run: /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Debuggers/${{matrix.arch}}/gflags.exe -i qemu-system-x86_64.exe +sls
      - run: /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Debuggers/${{matrix.arch}}/cdb.exe -c 'g;q' ./build/qemu-system-x86_64.exe --version || true
      - run: ./build/qemu-system-x86_64.exe -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-macos:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: macos-15-intel
          - arch: aarch64
            image: macos-26
    runs-on: ${{matrix.image}}
    steps:
      - uses: actions/checkout@v6
      - run: brew uninstall cmake # conflict with install command below
      - run: brew install --quiet $(env HOMEBREW_NO_ENV_HINTS=1 brew deps --include-build qemu) bison flex
      - run: brew install --quiet arm-none-eabi-gcc aarch64-elf-gcc i686-elf-gcc m68k-elf-gcc riscv64-elf-gcc x86_64-elf-gcc gdb
      - run: export PATH="$(brew --prefix bison)/bin:$PATH" && ./configure --enable-werror && ninja -C build all tcg-tests
      - run: ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin
      - run: ./build/pyvenv/bin/meson test -C build --suite tcg

  build-freebsd:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        with:
          copyback: false
          release: "15.1"
      - run: rsync -av ./ freebsd:/home/qemu/
      - shell: freebsd {0}
        run: set -ex && export IGNORE_OSVERSION=yes && pkg update && pkg install -y git gcc gmake python pkgconf pixman bison flex glib ninja
      - shell: freebsd {0}
        run: cd /home/qemu && ./configure --enable-werror && ninja -C build
      - shell: freebsd {0}
        run: cd /home/qemu && ./build/qemu-x86_64 -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000  -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin ./build/qemu-x86_64 --version
      - shell: freebsd {0}
        run: cd /home/qemu && ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-netbsd:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/netbsd-vm@v1
        with:
          copyback: false
          release: "10.1"
      - run: rsync -av ./ netbsd:/home/qemu/
      - shell: netbsd {0}
        run: set -ex && pkg_add pkgin && pkgin -y install git gmake python314 pkgconf pixman bison flex glib ninja-build && ln -s /usr/pkg/bin/python3.14 /usr/bin/python3
      - shell: netbsd {0}
        run: cd /home/qemu && ./configure --disable-werror && ninja -C build
      # for some reason meson can't find c++ compiler, so no cpp plugin
      # split-wx=on: https://gitlab.com/qemu-project/qemu/-/issues/2685
      - shell: netbsd {0}
        run: cd /home/qemu && ./build/qemu-system-x86_64 -accel tcg,split-wx=on -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -d plugin

  build-openbsd:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/openbsd-vm@v1
        with:
          copyback: false
          release: "7.8"
      # move root home to /home, which has all disk space
      - shell: openbsd {0}
        run: mv /root/ /home/ && ln -s /home/root/ /root
      - run: rsync -av ./ openbsd:/home/qemu/
      - shell: openbsd {0}
        run: set -ex && pkg_add dtc git pkgconf bzip2 xz ninja bash gmake gsed gettext-tools gnutls capstone sdl2 gtk+3 libxkbcommon zstd libslirp bison flex
      - shell: openbsd {0}
        run: cd /home/qemu && ./configure --disable-werror && ninja -C build
      # split-wx=on: https://gitlab.com/qemu-project/qemu/-/issues/2685
      - shell: openbsd {0}
        run: cd /home/qemu && ./build/qemu-system-x86_64 -accel tcg,split-wx=on -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-config:
    name: build-${{matrix.name}}
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: misc
            opts: --disable-user --disable-system --enable-docs --enable-tools
          - name: debug
            opts: --enable-rust --enable-debug --enable-modules
          - name: static
            opts: --disable-system --disable-tools --disable-guest-agent --disable-docs --static
          - name: tsan
            opts: --enable-tsan
          - name: clang
            opts: --cxx=clang++ --cc=clang --host-cc=clang --enable-debug
          - name: minimal
            opts: --without-default-features --without-default-devices --disable-kvm --disable-tcg
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      # FATAL: ThreadSanitizer: unexpected memory mapping 0x5ec055e3b000-0x5ec055e47000
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure --enable-werror ${{matrix.opts}} && ninja -C build install'

  build-clang-latest:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      # bypass package signature check by faking sqv binary
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'cp /usr/bin/echo /usr/bin/sqv && LLVM_VERSION=23 && apt update && apt install -y lsb-release wget gnupg && wget https://apt.llvm.org/llvm.sh && bash llvm.sh ${LLVM_VERSION} && ./configure --enable-werror --cxx=clang++-${LLVM_VERSION} --cc=clang-${LLVM_VERSION} --host-cc=clang-${LLVM_VERSION} --enable-debug && ninja -C build install'

  build-kvm-only:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64, ppc64el, riscv64, s390x]
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian-${{matrix.arch}}-cross
          bash -cx './configure --enable-werror --disable-tcg $QEMU_CONFIGURE_OPTS && ninja -C build install'

  build-xen-only:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian-${{matrix.arch}}-cross
          bash -cx './configure --enable-werror --disable-tcg --disable-kvm $QEMU_CONFIGURE_OPTS && ninja -C build install'

  build-oss-fuzz:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'mkdir build-oss-fuzz && export LSAN_OPTIONS=suppressions=scripts/lsan_suppressions.txt && CC="clang" CXX="clang++" CFLAGS="-fsanitize=address" ./scripts/oss-fuzz/build.sh'
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'for fuzzer in $(find ./build-oss-fuzz/DEST_DIR/ -executable -type f); do grep "LLVMFuzzerTestOneInput" ${fuzzer} >& /dev/null || continue; env ASAN_OPTIONS="fast_unwind_on_malloc=0" ${fuzzer} -runs=1 -seed=1 || exit 1; done'

  # run target specific meson tests, split per base architecture
  check:
    name: check (${{matrix.arch}}, host=${{matrix.host}})
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64, aarch64]
        arch: [aarch64, alpha, arm, avr, hexagon, hppa, i386, loongarch, m68k, microblaze, mips, or1k, ppc, riscv, rx, s390x, sh4, sparc, tricore, xtensa]
        include:
          - host: x86_64
            image: ubuntu-26.04
          - host: aarch64
            image: ubuntu-26.04-arm
          # all softmmu and linux-user targets in configs/targets
          - arch: aarch64
            targets: aarch64-linux-user,aarch64-softmmu,aarch64_be-linux-user
          - arch: alpha
            targets: alpha-linux-user,alpha-softmmu
          - arch: arm
            targets: arm-linux-user,arm-softmmu,armeb-linux-user
          - arch: avr
            targets: avr-softmmu
          - arch: hexagon
            targets: hexagon-linux-user,hexagon-softmmu
          - arch: hppa
            targets: hppa-linux-user,hppa-softmmu
          - arch: i386
            targets: i386-linux-user,i386-softmmu,x86_64-linux-user,x86_64-softmmu
          - arch: loongarch
            targets: loongarch64-linux-user,loongarch64-softmmu
          - arch: m68k
            targets: m68k-linux-user,m68k-softmmu
          - arch: microblaze
            targets: microblaze-linux-user,microblaze-softmmu,microblazeel-linux-user
          - arch: mips
            targets: mips-linux-user,mips-softmmu,mips64-linux-user,mips64-softmmu,mips64el-linux-user,mips64el-softmmu,mipsel-linux-user,mipsel-softmmu,mipsn32-linux-user,mipsn32el-linux-user
          - arch: or1k
            targets: or1k-linux-user,or1k-softmmu
          - arch: ppc
            targets: ppc-linux-user,ppc-softmmu,ppc64-linux-user,ppc64-softmmu,ppc64le-linux-user
          - arch: riscv
            targets: riscv32-linux-user,riscv32-softmmu,riscv64-linux-user,riscv64-softmmu
          - arch: rx
            targets: rx-softmmu
          - arch: s390x
            targets: s390x-linux-user,s390x-softmmu
          - arch: sh4
            targets: sh4-linux-user,sh4-softmmu,sh4eb-linux-user,sh4eb-softmmu
          - arch: sparc
            targets: sparc-linux-user,sparc-softmmu,sparc32plus-linux-user,sparc64-linux-user,sparc64-softmmu
          - arch: tricore
            targets: tricore-softmmu
          - arch: xtensa
            targets: xtensa-linux-user,xtensa-softmmu,xtensaeb-linux-user,xtensaeb-softmmu
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      - run: sudo apt update && sudo apt install -y qemu-user-binfmt
      - run: systemctl --user start podman.socket
      - run: bash -c "[ -e /dev/kvm ] && sudo chown $USER:$USER /dev/kvm || true"
      # we use image with download cache filled. Solves servers flakiness.
      # tcg tests cross compilers containers are probed at configure time
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          -v /var/run/user/$UID/podman/:/run/podman
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure --enable-werror --disable-docs --enable-rust --target-list=${{matrix.targets}} && ninja -C build'
      # not all targets have tcg tests
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          -v /var/run/user/$UID/podman/:/run/podman
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'if ninja -C build -t query tcg-tests >& /dev/null; then ninja -C build tcg-tests; fi'
      # run podman without -t to avoid interactive output of meson test
      # -j1 to prevent flakiness
      - run: >
          podman run --pull newer --init --privileged --rm -i $([ -e /dev/kvm ] && echo '-v /dev/kvm:/dev/kvm') -v $(pwd):$(pwd) -w $(pwd)
          -v /var/run/user/$UID/podman/:/run/podman
          docker.io/pboqemu/qemu-ci:debian
          bash -cx "./build/pyvenv/bin/meson test -C build -j1 --timeout-multiplier 2 --setup thorough --suite qtest --suite tcg --suite func-quick --suite func-thorough --print-errorlogs"

  # ensure check jobs cover all softmmu and linux-user targets
  # bsd-user targets can't be built on a linux host
  ci-targets:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: >
          diff -u
          <(ls configs/targets | grep -v bsd-user | sed 's/\.mak$//' | sort)
          <(sed -n 's/^ *targets: //p' .github/workflows/build.yml | tr , '\n' | sort)

  # run target independent meson tests, skipped by check jobs
  # TCG is needed for softfloat tests, and block tests use the host system
  # emulator when available
  check-common:
    needs: checkapply
    runs-on: ubuntu-26.04
    steps:
      - *free-disk
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure --enable-werror --disable-docs --enable-rust --target-list=x86_64-softmmu && ninja -C build'
      # run podman without -t to avoid interactive output of meson test
      - run: >
          podman run --pull newer --init --rm -i -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx "./build/pyvenv/bin/meson test -C build --setup thorough --no-suite qtest --no-suite tcg --no-suite func-quick --no-suite func-thorough --print-errorlogs"
